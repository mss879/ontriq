[build]
  command = "npm run build"
  publish = ".next"

# Netlify's Next.js Runtime
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Canonical host + HTTPS enforcement
# Redirect apex domain to www (permanent)
[[redirects]]
  from = "https://ontriq.com/*"
  to = "https://www.ontriq.com/:splat"
  status = 301
  force = true

# If any HTTP traffic reaches Netlify, push it to HTTPS + www
[[redirects]]
  from = "http://ontriq.com/*"
  to = "https://www.ontriq.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.ontriq.com/*"
  to = "https://www.ontriq.com/:splat"
  status = 301
  force = true

# ─── Security Headers ───────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://framerusercontent.com https://*.supabase.co; connect-src 'self' https://*.supabase.co https://api.emailjs.com; frame-src https://calendly.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 3000
  framework = "next"
